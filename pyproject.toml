[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-wildfire-risk-forecast"
version = "2.1.0"
description = "Retrospective satellite hotspot risk experiments and historical replay for Mato Grosso, Brazil."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Eduardo Tostes" }
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".dvc",
    "mlruns",
    "notebooks",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "artifacts: inference using tracked model and sample artifacts",
    "integration: controlled end-to-end component integration",
    "pipeline: full historical data and training required",
    "download: external source acquisition required",
    "performance: measured performance rather than correctness",
]

