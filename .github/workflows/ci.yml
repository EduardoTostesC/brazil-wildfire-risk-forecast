name: CI Pipeline

on:
  push:
    branches: [ main, 'audit/**', 'release/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; Node.js 24

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node.js 24
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements-cpu.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-cpu.lock
        python -m pip check
        python -m pip freeze > environment.txt

    - name: Lint with Ruff
      run: |
        ruff check . --ignore E501,E402

    - name: Run Test Suite
      run: |
        python -m pytest tests/ -v --junitxml=test-results.xml

    - name: Verify generated documentation
      run: |
        python -m src.reporting.generate_readme_metrics --check
        python -m src.reporting.generate_research_tables --check
        python scripts/verify_frozen_protocol.py

    - name: Preserve validation evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node.js 24
      with:
        name: validation-python-${{ matrix.python-version }}
        path: |
          test-results.xml
          environment.txt

  serving:
    name: Runtime-only Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install only serving and verify real inference
      run: |
        python -m pip install --require-hashes -r app/requirements.txt
        python -m pip check
        python -m src.models.artifacts --verify
        python scripts/smoke_api.py

  docker:
    name: Docker build and HTTP smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; Node.js 24

    - name: Build CPU image
      run: python scripts/measure_docker_build.py --file Dockerfile --tag wildfire-audit:ci --output reports/evidence/docker-research-build.json

    - name: Validate container API, artifacts and published port
      run: |
        mkdir -p reports/evidence
        docker run --detach --name wildfire-api --publish 127.0.0.1:8000:8000 wildfire-audit:ci
        curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
        docker exec wildfire-api python -m src.models.artifacts --verify
        docker exec wildfire-api python scripts/smoke_api.py --base-url http://127.0.0.1:8000
        docker cp wildfire-api:/app/reports/evidence/real-http-examples.json reports/evidence/docker-http-examples.json
        test "$(docker exec wildfire-api id -u)" = 1000
        for attempt in $(seq 1 30); do
          if test "$(docker inspect --format '{{.State.Health.Status}}' wildfire-api)" = healthy; then break; fi
          sleep 2
        done
        test "$(docker inspect --format '{{.State.Health.Status}}' wildfire-api)" = healthy
        docker image inspect wildfire-audit:ci > reports/evidence/docker-image.json

    - name: Validate Streamlit container entrypoint
      run: |
        docker run --detach --name wildfire-dashboard --publish 127.0.0.1:8501:8501 \
          --health-cmd 'curl --fail --silent http://localhost:8501/_stcore/health' \
          --health-interval 2s --health-start-period 5s \
          wildfire-audit:ci python -m streamlit run app/streamlit_app.py --server.address 0.0.0.0
        curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8501/_stcore/health
        curl --fail http://127.0.0.1:8501/ > reports/evidence/docker-streamlit.html
        for attempt in $(seq 1 30); do
          if test "$(docker inspect --format '{{.State.Health.Status}}' wildfire-dashboard)" = healthy; then break; fi
          sleep 2
        done
        test "$(docker inspect --format '{{.State.Health.Status}}' wildfire-dashboard)" = healthy

    - name: Build runtime-only image and compare HTTP responses
      run: |
        python scripts/measure_docker_build.py --file Dockerfile.serving --target api --tag wildfire-serving:ci --output reports/evidence/docker-serving-build.json
        docker run --detach --name wildfire-serving --publish 127.0.0.1:8001:8000 wildfire-serving:ci
        python scripts/verify_serving_parity.py --reference-url http://127.0.0.1:8000 --candidate-url http://127.0.0.1:8001 --output reports/evidence/docker-serving-parity.json
        docker exec wildfire-serving python -m src.models.artifacts --verify
        test "$(docker exec wildfire-serving id -u)" = 1000
        docker build --file Dockerfile.serving --target dashboard --tag wildfire-serving-dashboard:ci .
        docker run --detach --name wildfire-serving-dashboard --publish 127.0.0.1:8502:8501 wildfire-serving-dashboard:ci
        curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8502/_stcore/health
        for container in wildfire-serving wildfire-serving-dashboard; do
          for attempt in $(seq 1 30); do
            if test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy; then break; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
        done

    - name: Collect container evidence
      if: always()
      run: |
        mkdir -p reports/evidence
        docker logs wildfire-api > reports/evidence/docker-api.log 2>&1 || true
        docker logs wildfire-dashboard > reports/evidence/docker-dashboard.log 2>&1 || true
        docker logs wildfire-serving > reports/evidence/docker-serving.log 2>&1 || true
        docker logs wildfire-serving-dashboard > reports/evidence/docker-serving-dashboard.log 2>&1 || true
        docker inspect wildfire-api wildfire-dashboard wildfire-serving wildfire-serving-dashboard > reports/evidence/docker-containers.json || true

    - name: Preserve Docker evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node.js 24
      with:
        name: validation-docker
        path: reports/evidence/docker-*

    - name: Stop temporary containers
      if: always()
      run: |
        docker rm --force wildfire-api wildfire-dashboard wildfire-serving wildfire-serving-dashboard || true

